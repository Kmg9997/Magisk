name: Khalid Quality Probe

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/khalid-quality-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: khalid-v1-pro
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and install
        run: |
          mkdir -p /tmp/khalid
          cat khalid_ai_trader_v10/app.part*.b64 | base64 -d > /tmp/khalid/app.tgz
          tar -xzf /tmp/khalid/app.tgz -C /tmp/khalid
          cd /tmp/khalid/khalid_v100
          sed -i 's/^xgboost.*$/xgboost-cpu==3.4.1/' requirements.txt
          pip install --disable-pip-version-check -q -r requirements.txt
      - name: Inspect exact training function
        run: |
          cd /tmp/khalid/khalid_v100
          python - <<'PY'
          from pathlib import Path
          import ast, inspect, importlib
          src=Path('app_cloud.py').read_text(encoding='utf-8')
          lines=src.splitlines()
          tree=ast.parse(src)
          target=832
          print('=== ENCLOSING FUNCTION FOR QUALITY GATE ===')
          for n in ast.walk(tree):
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and getattr(n,'lineno',0)<=target<=getattr(n,'end_lineno',0):
                  print(n.name, n.lineno, n.end_lineno)
                  for j in range(n.lineno-1,min(n.end_lineno,len(lines))):
                      print(f'{j+1:04d}: {lines[j]}')
                  break
          print('=== CONSTANTS / SYMBOL NORMALIZATION ===')
          for i,line in enumerate(lines[:180]):
              if any(k in line for k in ['UP_PCT','DOWN_PCT','ROUND_TRIP_COST_BPS','CONFIDENCE_THRESHOLD','CURRENT_SYMBOL','SYMBOL_NAMES','normalize_symbol','TRAIN']):
                  print(f'{i+1:04d}: {line}')
          m=importlib.import_module('app_cloud')
          print('=== CALLABLES ===')
          for name in dir(m):
              if any(k in name.lower() for k in ['train','bootstrap','walk','backtest','feature','dataset']):
                  obj=getattr(m,name)
                  if callable(obj):
                      try: print(name, inspect.signature(obj))
                      except: print(name)
          PY
