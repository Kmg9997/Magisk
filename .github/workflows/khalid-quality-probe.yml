name: Khalid UI Probe
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/khalid-quality-probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: khalid-v1-pro
      - name: Reconstruct
        run: |
          mkdir -p /tmp/khalid
          cat khalid_ai_trader_v10/app.part*.b64 | base64 -d > /tmp/khalid/app.tgz
          tar -xzf /tmp/khalid/app.tgz -C /tmp/khalid
      - name: Print stock selector and APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/khalid/khalid_v100/static/index.html'),Path('/tmp/khalid/khalid_v100/app_cloud.py')]:
              lines=p.read_text(encoding='utf-8').splitlines()
              print('===FILE',p.name,'===')
              keys=['symbolSelect','/api/select','اختيار السهم','quick','favorites','المفضلة','display_name','SYMBOL_NAMES','def public_state']
              seen=set()
              for i,line in enumerate(lines):
                  if any(k.lower() in line.lower() for k in keys):
                      a=max(0,i-12); b=min(len(lines),i+30)
                      if any(j in seen for j in range(a,b)): continue
                      seen.update(range(a,b))
                      print(f'---around {i+1}---')
                      for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
          PY
