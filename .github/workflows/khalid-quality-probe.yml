name: Khalid Quality Probe

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/khalid-quality-probe.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: khalid-v1-pro
      - name: Build exact deployed image
        run: docker build -t khalid-quality-audit -f khalid_ai_trader_v10/Dockerfile khalid_ai_trader_v10
      - name: Create audit runner
        shell: bash
        run: |
          cat > /tmp/audit.py <<'PY'
          import sys, time, json, math, gc
          sys.path.insert(0, "/app/khalid_v100")
          import app_cloud as m

          universe = [
              ("1320","أنابيب السعودية"),
              ("2222","أرامكو"),
              ("1120","الراجحي"),
              ("1180","الأهلي"),
              ("1010","الرياض"),
              ("1150","الإنماء"),
              ("2010","سابك"),
              ("1211","معادن"),
              ("7203","علم"),
              ("1820","بان"),
          ]

          checks = [
              ("balanced_accuracy", lambda x: x.get("balanced_accuracy") is not None and x["balanced_accuracy"] >= 0.42),
              ("balanced_accuracy_ci_low", lambda x: x.get("balanced_accuracy_ci_low") is not None and x["balanced_accuracy_ci_low"] >= 0.35),
              ("macro_f1", lambda x: x.get("macro_f1") is not None and x["macro_f1"] >= 0.40),
              ("up_precision", lambda x: x.get("up_precision") is not None and x["up_precision"] >= 0.45),
              ("up_calibration_error", lambda x: x.get("up_calibration_error") is not None and x["up_calibration_error"] <= 0.12),
              ("trades", lambda x: (x.get("trades") or 0) >= 20),
              ("profit_factor", lambda x: x.get("profit_factor") is not None and x["profit_factor"] >= 1.10),
              ("avg_trade_pct", lambda x: x.get("avg_trade_pct") is not None and x["avg_trade_pct"] > 0),
              ("avg_trade_ci_low", lambda x: x.get("avg_trade_ci_low") is not None and x["avg_trade_ci_low"] > 0),
              ("positive_chunk_share", lambda x: x.get("positive_chunk_share") is not None and x["positive_chunk_share"] >= 0.50),
          ]

          print("AUDIT_START", flush=True)
          print("AUDIT_UNIVERSE", json.dumps(universe, ensure_ascii=False), flush=True)
          market = m.fetch(m.MARKET_SYMBOL, "5m", "60d")
          print("AUDIT_MARKET_ROWS", len(market), flush=True)
          results=[]

          for code,name in universe:
              sym=m.normalize_symbol(code)
              started=time.perf_counter()
              try:
                  df=m.fetch(sym,"5m","60d")
                  df=m.attach_market_context(df,market)
                  m.CURRENT_SYMBOL=sym
                  m.CURRENT_NAME=m.display_name(sym)
                  m.STATE=m.RuntimeState(symbol=sym,name=m.CURRENT_NAME,status="تدقيق")
                  m.BUNDLE=None
                  m.MODEL_SYMBOL=None
                  m.FEATURE_COLS=[]
                  m.MODEL_META={}
                  m.LAST_5M=df
                  m.LAST_TRAIN_MONO=0.0
                  m.TRAINING=False
                  m.train_model(sym)
                  metrics=dict(m.STATE.metrics or {})
                  qualified=bool(m.STATE.qualified)
                  failed=list(metrics.get("qualification_failures") or [])
                  passed_count=sum(1 for _,fn in checks if fn(metrics))
                  row={
                      "code":code,"name":name,"symbol":sym,
                      "qualified":qualified,
                      "passed_checks":passed_count,
                      "failed_checks_count":len(failed),
                      "failures":failed,
                      "balanced_accuracy":metrics.get("balanced_accuracy"),
                      "balanced_accuracy_ci_low":metrics.get("balanced_accuracy_ci_low"),
                      "macro_f1":metrics.get("macro_f1"),
                      "up_precision":metrics.get("up_precision"),
                      "up_calibration_error":metrics.get("up_calibration_error"),
                      "trades":metrics.get("trades"),
                      "profit_factor":metrics.get("profit_factor"),
                      "avg_trade_pct":metrics.get("avg_trade_pct"),
                      "avg_trade_ci_low":metrics.get("avg_trade_ci_low"),
                      "positive_chunk_share":metrics.get("positive_chunk_share"),
                      "rows":metrics.get("rows"),
                      "error":m.STATE.error,
                      "seconds":round(time.perf_counter()-started,2),
                  }
              except Exception as exc:
                  row={"code":code,"name":name,"symbol":sym,"qualified":False,"error":repr(exc),"seconds":round(time.perf_counter()-started,2)}
              results.append(row)
              print("AUDIT_RESULT", json.dumps(row,ensure_ascii=False,sort_keys=True), flush=True)
              gc.collect()

          qualified=[r for r in results if r.get("qualified")]
          ranking=sorted(results,key=lambda r:(r.get("passed_checks",-1), r.get("profit_factor") if isinstance(r.get("profit_factor"),(int,float)) else -999),reverse=True)
          fail_counts={}
          for r in results:
              for x in r.get("failures",[]) or []:
                  fail_counts[x]=fail_counts.get(x,0)+1
          summary={
              "tested":len(results),
              "qualified_count":len(qualified),
              "qualified":[{"code":r["code"],"name":r["name"]} for r in qualified],
              "ranking":[{"code":r["code"],"name":r["name"],"passed_checks":r.get("passed_checks"),"failed_checks_count":r.get("failed_checks_count"),"profit_factor":r.get("profit_factor"),"avg_trade_pct":r.get("avg_trade_pct")} for r in ranking],
              "failure_frequency":fail_counts,
          }
          print("AUDIT_SUMMARY",json.dumps(summary,ensure_ascii=False,sort_keys=True),flush=True)
          PY
      - name: Run exact quality audit
        run: docker run --rm -v /tmp/audit.py:/audit.py:ro --entrypoint python khalid-quality-audit /audit.py
