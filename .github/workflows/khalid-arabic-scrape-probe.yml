name: Khalid Arabic Scrape Probe
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/khalid-arabic-scrape-probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: khalid-v1-pro
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q requests beautifulsoup4
      - name: Reconstruct and inspect
        run: |
          mkdir -p /tmp/khalid
          cat khalid_ai_trader_v10/app.part*.b64 | base64 -d > /tmp/khalid/app.tgz
          tar -xzf /tmp/khalid/app.tgz -C /tmp/khalid
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/khalid/khalid_v100/app_cloud.py').read_text(encoding='utf-8').splitlines()
          for a,b in [(30,75),(640,690),(780,810),(925,960),(1198,1220)]:
              print(f'=== RANGE {a}-{b} ===')
              for j in range(a-1,min(b,len(lines))): print(f'{j+1:04d}: {lines[j]}')
          PY
      - name: Probe official Arabic names
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          url='https://www.saudiexchange.sa/wps/portal/saudiexchange/hidden/company-profile-main/!ut/p/z1/04_Sj9CPykssy0xPLMnMz0vMAfIjo8ziTR3NDIw8LAz83d2MXA0C3SydAl1c3Q0NvE30I4EKzBEKDMKcTQzMDPxN3H19LAzdTU31w8syU8v1wwkpK8hOMgUA-oskdg!!/'
          for code in ['4031','1120','2222','7203','1820','1320']:
              r=requests.get(url,params={'companySymbol':code,'locale':'ar'},timeout=30,headers={'User-Agent':'Mozilla/5.0'})
              print('CODE',code,'STATUS',r.status_code,'LEN',len(r.text),'URL',r.url)
              soup=BeautifulSoup(r.text,'html.parser')
              texts=[x.get_text(' ',strip=True) for x in soup.find_all(['h1','h2','h3','h4']) if x.get_text(strip=True)]
              ar=[t for t in texts if re.search(r'[\u0600-\u06FF]',t)]
              print('HEADINGS',ar[:15])
              # print candidate strings close to symbol
              plain=soup.get_text('\n',strip=True)
              pos=plain.find(code)
              if pos>=0: print('AROUND',plain[max(0,pos-300):pos+300].replace('\n',' | '))
          PY
