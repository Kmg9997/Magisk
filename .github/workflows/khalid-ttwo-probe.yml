name: Khalid TTWO Probe
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/khalid-ttwo-probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: khalid-v1-pro
      - name: Reconstruct
        run: |
          mkdir -p /tmp/khalid
          cat khalid_ai_trader_v10/app.part*.b64 | base64 -d > /tmp/khalid/app.tgz
          tar -xzf /tmp/khalid/app.tgz -C /tmp/khalid
      - name: Inspect market-specific code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/khalid/khalid_v100/app_cloud.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          keys=['MARKET_SYMBOL','Saudi','السعود','Riyadh','timezone','tz_','session','market_open','market_close','HORIZON_BARS','normalize_symbol','currency','ر.س','attach_market_context','fetch(MARKET_SYMBOL','MARKET_']
          seen=set()
          for i,line in enumerate(lines):
              if any(k.lower() in line.lower() for k in keys):
                  a=max(0,i-8); b=min(len(lines),i+24)
                  if any(j in seen for j in range(a,b)): continue
                  seen.update(range(a,b))
                  print(f'---around {i+1}---')
                  for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
          PY
