name: Khalid Targets Probe
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/khalid-targets-probe.yml' ]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: khalid-v1-pro
      - name: Reconstruct
        run: |
          mkdir -p /tmp/khalid
          cat khalid_ai_trader_v10/app.part*.b64 | base64 -d > /tmp/khalid/app.tgz
          tar -xzf /tmp/khalid/app.tgz -C /tmp/khalid
      - name: Inspect targets and chart labels
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in [Path('/tmp/khalid/khalid_v100/app_cloud.py'),Path('/tmp/khalid/khalid_v100/static/index.html')]:
              lines=p.read_text(encoding='utf-8').splitlines()
              print('===FILE',p.name,'===')
              keys=['target1','target2','t1','t2','stop','invalidation','risk_reward','rr','createPriceLine','priceFormat','precision','minMove']
              seen=set()
              for i,line in enumerate(lines):
                  ll=line.lower()
                  if any(k.lower() in ll for k in keys):
                      a=max(0,i-10); b=min(len(lines),i+25)
                      if any(j in seen for j in range(a,b)): continue
                      seen.update(range(a,b))
                      print(f'---around {i+1}---')
                      for j in range(a,b): print(f'{j+1:04d}: {lines[j]}')
          PY
