name: Khalid Targets Probe
on:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/khalid-targets-probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: khalid-v1-pro }
      - run: |
          mkdir -p /tmp/khalid
          cat khalid_ai_trader_v10/app.part*.b64 | base64 -d > /tmp/khalid/app.tgz
          tar -xzf /tmp/khalid/app.tgz -C /tmp/khalid
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/khalid/khalid_v100/app_cloud.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              if 'research_target_1' in line or 'research_target_2' in line or 'research_stop' in line:
                  print('---',i+1,'---')
                  for j in range(max(0,i-8),min(len(lines),i+12)):
                      print(f'{j+1:04d}: {lines[j]}')
          PY
